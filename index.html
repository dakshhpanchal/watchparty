<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchParty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20M9 9v1a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.7M17 16.9A7 7 0 0 1 5 10M19 10a7 7 0 0 1-.2 1.6M12 17v4"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-stats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  </defs>
</svg>

<div id="lobby">
  <div class="lobby-wrap">
    <div class="hero">
      <h1>WatchParty</h1>
      <p>Peer-to-peer screen sharing and chat. No accounts, no server.</p>
    </div>
    <div class="cards">
      <form class="card" id="create-form">
        <h2>Create Room</h2>
        <p>Host a private watch party.</p>
        <div class="input-group">
          <input id="host-name" placeholder="Your name" maxlength="32" autocomplete="nickname" aria-label="Your name">
          <button class="btn btn-primary" id="create-btn" type="submit">Create Room</button>
          <div class="form-error" id="create-error" role="alert"></div>
        </div>
      </form>
      <form class="card" id="join-form">
        <h2>Join Room</h2>
        <p>Enter the 6-character room code (e.g. ABC-123).</p>
        <div class="input-group">
          <input id="join-name" placeholder="Your name" maxlength="32" autocomplete="nickname" aria-label="Your name">
          <input id="join-code" placeholder="Room code" maxlength="7" autocomplete="off" spellcheck="false" aria-label="Room code">
          <button class="btn btn-secondary" id="join-btn" type="submit">Join Room</button>
          <div class="form-error" id="join-error" role="alert"></div>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="room">
  <div class="topbar">
    <div class="logo">WatchParty</div>
    <div class="room-pill" id="header-room-id"></div>
    <button class="link-btn" id="copy-link-btn" type="button"><svg class="icon"><use href="#i-link"/></svg>Copy link</button>
    <div class="peer-count" title="People in room"><svg class="icon"><use href="#i-users"/></svg><span id="peer-count-num">1</span></div>
    <div class="spacer"></div>
    <button class="leave-btn" id="leave-room-btn" type="button">Leave</button>
  </div>

  <div class="room-layout">
    <div class="stage" id="stage">
      <video id="main-video" autoplay playsinline muted></video>
      <div class="placeholder" id="placeholder">No screen shared</div>
      <div class="stage-label hidden" id="stage-label"></div>
      <div class="stage-tools">
        <button class="stage-tool" id="stats-btn" type="button" aria-label="Show stream stats" aria-pressed="false" title="Stream stats"><svg class="icon"><use href="#i-stats"/></svg></button>
        <button class="stage-tool" id="fullscreen-btn" type="button" aria-label="Fullscreen" title="Fullscreen"><svg class="icon"><use href="#i-full"/></svg></button>
      </div>
      <button class="btn btn-primary hidden" id="unmute-btn" type="button"><svg class="icon"><use href="#i-volume"/></svg>Click to enable audio</button>
      <div id="stats" class="hidden"></div>
    </div>

    <div class="sidebar">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="peers" role="tab" type="button">People</button>
        <button class="tab-btn" data-tab="chat" role="tab" type="button">Chat <span id="chat-badge">0</span></button>
      </div>
      <div class="panel peers-list active" id="peers-panel"></div>
      <div class="panel" id="chat-panel">
        <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
        <form class="chat-input" id="chat-form">
          <input id="chat-input" type="text" placeholder="Message..." maxlength="300" autocomplete="off" aria-label="Chat message">
          <button class="btn btn-secondary" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" id="share-btn" type="button"><svg class="icon"><use href="#i-screen"/></svg><span>Share Screen</span></button>
    <select id="quality-select" aria-label="Share quality" title="Share quality (lower it if viewers lag)">
      <option value="1080p30" selected>1080p · 30fps</option>
      <option value="1080p60">1080p · 60fps</option>
      <option value="720p30">720p · 30fps</option>
    </select>
    <button class="ctrl-btn" id="mute-btn" type="button"><svg class="icon"><use href="#i-mic-off"/></svg><span>Enable Mic</span></button>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="app.js" defer></script>
</body>
</html>
